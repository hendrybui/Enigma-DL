<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ultimate Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="header-icon">📥</div>
      <div class="header-text">
        <h1>Ultimate Downloader</h1>
        <p>Download images &amp; videos from any site</p>
      </div>
    </div>

    <div class="actions-row">
      <button id="scanBtn" class="btn btn-primary">🔍 Scan Page</button>
      <button id="downloadAllBtn" class="btn btn-success" disabled>⬇️ Download All</button>
    </div>

    <div class="filters-row">
      <label class="filter-label">
        <input type="checkbox" id="filterImages" checked>
        <span>Images</span>
      </label>
      <label class="filter-label">
        <input type="checkbox" id="filterVideos" checked>
        <span>Videos</span>
      </label>
      <label class="filter-label">
        <input type="checkbox" id="filterAudio" checked>
        <span>Audio</span>
      </label>
      <label class="filter-label">
        <input type="checkbox" id="filterDocuments" checked>
        <span>Docs</span>
      </label>
      <div class="min-size">
        <span>Min Size:</span>
        <input type="number" id="minSize" placeholder="0" min="0" value="0">
        <span>KB</span>
      </div>
    </div>

    <div class="stats-row">
      <span id="statsImages" class="stat stat-image">0 images</span>
      <span id="statsVideos" class="stat stat-video">0 videos</span>
      <span id="statsAudio" class="stat stat-audio">0 audio</span>
      <span id="statsDocs" class="stat stat-doc">0 docs</span>
    </div>

    <div id="mediaList" class="media-list">
      <div class="empty-state">No media found. Click "Scan Page" to discover media.</div>
    </div>

    <div class="footer-row">
      <button id="clearBtn" class="btn btn-secondary">Clear List</button>
      <span id="statusMsg" class="status-msg"></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
